name: Erbium x64 build

on:
  push:
    branches:
      - feature/worldcup-solo-9.40
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-erbium:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore original libcurl dependencies
        shell: pwsh
        run: |
          & ".\ESnowLauncherBETAOFFICIAL snow filesOld Syndicate Filesgame-serverErbium\restore-libcurl.ps1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test World Cup Solo matchmaking selection
        run: node --test tests/worldcup-playlist.test.cjs

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile and test launcher World Cup Solo options
        run: dotnet run --project tests/MatchOptionsCompile/MatchOptionsCompile.csproj --configuration Release

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Erbium x64 Release
        shell: pwsh
        run: |
          $project = ".\ESnowLauncherBETAOFFICIAL snow filesOld Syndicate Filesgame-serverErbium\Erbium.vcxproj"
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\Erbium\"
          $int = Join-Path $env:GITHUB_WORKSPACE "artifacts\obj\"
          New-Item -ItemType Directory -Force -Path $out, $int | Out-Null
          msbuild $project /m /t:Build /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$out" "/p:IntDir=$int" /v:minimal

      - name: Package World Cup Solo replacement files
        shell: pwsh
        run: |
          $files = @(
            "ESnowLauncherBETAOFFICIAL snow filesLauncherSnowLauncherRuntimeMatchmaker/playlists.cjs",
            "ESnowLauncherBETAOFFICIAL snow filesLauncherSnowLauncherRuntimesrcRoutes/contentpages.js",
            "ESnowLauncherBETAOFFICIAL snow filesLauncherSnowLauncherServices/MatchOptions.cs",
            "ESnowLauncherBETAOFFICIAL snow filesOld Syndicate Filesgame-server/Erbium.sln",
            "ESnowLauncherBETAOFFICIAL snow filesOld Syndicate Filesgame-serverErbium/Erbium.vcxproj",
            "ESnowLauncherBETAOFFICIAL snow filesOld Syndicate Filesgame-serverErbium/Erbium.vcxproj.filters",
            "ESnowLauncherBETAOFFICIAL snow filesOld Syndicate Filesgame-serverErbium/restore-libcurl.ps1",
            "Erbium/Private/dllmain.cpp",
            "FortniteGame/Private/FortGameMode.cpp",
            "pch.h"
          )
          $stage = Join-Path $env:GITHUB_WORKSPACE "artifacts\WorldCupSolo-Replacements"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($file in $files) {
            $source = Join-Path $env:GITHUB_WORKSPACE $file
            if (!(Test-Path $source)) { throw "Replacement file is missing: $file" }
            $destination = Join-Path $stage $file
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }
          $build = Join-Path $stage "Build"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          Copy-Item "artifacts\Erbium\Erbium.dll" $build -Force
          Copy-Item "artifacts\Erbium\Erbium.pdb" $build -Force
          @"
          Project Snow — World Cup Solo source replacements

          This package contains only the changed source/project files, preserving their repository paths,
          plus the Erbium x64 Release DLL and PDB built by the Windows CI job.

          Important:
          - This is a source/build test package, not a complete launcher release.
          - The MatchOptions.cs change must be included in a rebuilt launcher executable before an older
            installed launcher can recognize the worldcupsolo mode.
          - The original Fortnite 9.40 client/server has not yet been run with this build.
          - Back up existing files before replacing anything.
          - Run restore-libcurl.ps1 from its included project folder before rebuilding Erbium from source.
          "@ | Set-Content -LiteralPath (Join-Path $stage "BUILD-INFO.txt") -Encoding UTF8
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "artifacts\ProjectSnow-WorldCupSolo-Replacements.zip" -Force

      - name: Upload World Cup Solo replacement package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectSnow-WorldCupSolo-Replacements
          path: artifacts/ProjectSnow-WorldCupSolo-Replacements.zip
          if-no-files-found: error

      - name: Upload Erbium build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Erbium-x64-Release
          path: artifacts/Erbium/
          if-no-files-found: error
